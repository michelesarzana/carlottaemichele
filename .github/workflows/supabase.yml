# Aggiorna Supabase a ogni modifica della cartella supabase/:
# applica gli script SQL nuovi e pubblica le funzioni.
# Serve il segreto SUPABASE_ACCESS_TOKEN nelle impostazioni della repo.
name: Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency: supabase

env:
  PROJECT_REF: btyvzzmyzmlvyhxwavxd
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla il segreto
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Manca il segreto SUPABASE_ACCESS_TOKEN (Settings › Secrets and variables › Actions)."
            exit 1
          fi

      - name: Applica gli script SQL nuovi
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            jq -n --arg q "$1" '{query: $q}' > /tmp/body.json
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$api" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/body.json)
            if [ "$code" -ge 300 ]; then echo "Errore $code:"; cat /tmp/out.json; echo; return 1; fi
          }
          # Registro degli script già applicati (non leggibile da fuori)
          run_sql "create table if not exists public._migrations (name text primary key, applied_at timestamptz not null default now()); alter table public._migrations enable row level security;"
          run_sql "select name from public._migrations"
          jq -r '.[].name' /tmp/out.json > /tmp/applied.txt || true
          for f in $(ls supabase/migrations/*.sql | sort); do
            name=$(basename "$f")
            if grep -qx "$name" /tmp/applied.txt; then echo "Già applicato: $name"; continue; fi
            echo "Applico: $name"
            run_sql "$(cat "$f")"
            run_sql "insert into public._migrations (name) values ('$name') on conflict do nothing"
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Pubblica le funzioni
        run: |
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            echo "Pubblico: $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
