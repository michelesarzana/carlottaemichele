# Prove di rete dai server di GitHub, per capire dove si rompe una ricerca.
name: Debug

on:
  push:
    branches: [main]
    paths: ['.github/scripts/debug.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/debug.sh > .github/scripts/debug.out 2>&1 || true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .github/scripts/debug.out
          git commit -m "Risultati debug" || exit 0
          git pull --rebase -q && git push
