# Esegue le query di sola lettura in supabase/queries/*.sql e salva i risultati
# accanto (*.result.json). Solo dati già pubblici: niente date, niente editor.
name: Leggi database

on:
  push:
    branches: [main]
    paths: ['supabase/queries/*.sql']
  workflow_dispatch:

permissions:
  contents: write

concurrency: supabase

env:
  PROJECT_REF: btyvzzmyzmlvyhxwavxd
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Esegui le query
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          for f in supabase/queries/*.sql; do
            out="${f%.sql}.result.json"
            # sola lettura: la query gira dentro una transazione read only
            jq -n --arg q "set transaction read only; $(cat "$f")" '{query: $q}' > /tmp/body.json
            curl -sS -X POST "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data @/tmp/body.json | jq . > "$out" || true
          done
      - name: Salva i risultati
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add supabase/queries/*.result.json
          git commit -m "Risultati query" || exit 0
          git pull --rebase -q && git push
